<div id="view-reports" class="hidden w-full transition-opacity duration-300">
  <header class="mb-6">
    <div class="mb-1 flex items-center gap-3">
      <div class="ui-icon-tile ui-icon-tile-lg">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
          />
          <polyline points="14 2 14 8 20 8" />
          <line x1="16" y1="13" x2="8" y2="13" />
          <line x1="16" y1="17" x2="8" y2="17" />
        </svg>
      </div>
      <h2 class="text-primary text-3xl font-bold tracking-tight">
        Relatórios de Testes
      </h2>
    </div>
    <p class="text-muted-foreground mt-1 ml-1 max-w-3xl text-sm">
      Histórico salvo de auditorias de qualidade e testes de ciclagem ·
      <span id="reports-count" class="text-primary font-bold">0</span>
      relatório(s)
    </p>
  </header>
  <div class="flex flex-col gap-6">
    <!-- Lista de relatórios -->
    <section class="ui-panel">
      <div class="ui-panel-head">
        <div class="flex items-center gap-3">
          <span class="ui-icon-tile ui-icon-tile-sm"
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
              />
              <polyline points="14 2 14 8 20 8" />
              <line x1="16" y1="13" x2="8" y2="13" />
              <line x1="16" y1="17" x2="8" y2="17" /></svg
          ></span>
          <div>
            <h3 class="ui-panel-title">Lista de relatórios</h3>
            <p class="ui-panel-subtitle">
              Selecione um relatório para ver os dados e exportar
            </p>
          </div>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <select id="reports-filter-type" class="ui-input w-auto py-1.5">
            <option value="">Todos os tipos</option>
            <option value="cyclic">Ciclagem</option>
            <option value="quality">Qualidade</option>
          </select>
          <select id="reports-filter-status" class="ui-input w-auto py-1.5">
            <option value="">Todos os status</option>
            <option value="completed">Concluído</option>
            <option value="aprovado">Aprovado</option>
            <option value="reprovado">Reprovado</option>
            <option value="failed">Falhou</option>
            <option value="stopped">Interrompido</option>
          </select>
        </div>
      </div>
      <div id="reports-grid-container" class="w-full p-5"></div>
      <div id="reports-empty-state" class="hidden">
        <div class="ui-empty">
          <span class="ui-icon-tile ui-tone-neutral mb-2"
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
              />
              <polyline points="14 2 14 8 20 8" />
              <line x1="16" y1="13" x2="8" y2="13" />
              <line x1="16" y1="17" x2="8" y2="17" /></svg
          ></span>
          <p class="text-sm font-semibold">Nenhum relatório ainda</p>
          <p class="text-muted-foreground max-w-xs text-xs">
            Conclua um teste de ciclagem ou qualidade e salve o relatório para
            vê-lo aqui.
          </p>
        </div>
      </div>
    </section>
    <!-- Dados do relatório (bloco separado, preenchido pelo ReportsPanel) -->
    <div id="reports-detail-container" class="hidden w-full"></div>
  </div>
</div>
