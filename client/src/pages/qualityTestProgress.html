<div
  id="view-quality-test-progress"
  class="hidden w-full transition-opacity duration-300"
>
  <button
    id="btn-back-quality-list"
    class="text-muted-foreground hover:text-primary mb-6 flex cursor-pointer items-center gap-2 font-medium transition-colors"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="m15 18-6-6 6-6" />
    </svg>
    Voltar para a Auditoria de Qualidade
  </button>

  <header class="mb-8">
    <h2 class="text-primary text-3xl font-bold tracking-tight">
      Progresso da Auditoria Atual
    </h2>
  </header>

  <div
    id="quality-steps-container"
    class="bg-card border-border w-full rounded-2xl border shadow-sm"
  >
    <div
      class="border-border flex items-center justify-between border-b px-5 py-4"
    >
      <h3 class="text-lg font-bold">Status Atual</h3>
      <span
        id="quality-test-status"
        class="text-muted-foreground text-sm font-bold"
        >Aguardando Início</span
      >
    </div>
    <div class="p-5">
      <ul id="quality-results-list" class="flex flex-col gap-2"></ul>
    </div>
  </div>
</div>
