<div
  id="view-quality-test-progress"
  class="hidden w-full transition-opacity duration-300"
>
  <button
    id="btn-back-quality-list"
    type="button"
    class="ui-btn ui-btn-ghost ui-btn-sm -ml-2 mb-4"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="m15 18-6-6 6-6" />
    </svg>
    Voltar para a Auditoria de Qualidade
  </button>

  <header class="mb-6">
    <div class="mb-1 flex items-center gap-3">
      <div class="ui-icon-tile ui-icon-tile-lg">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
        </svg>
      </div>
      <h2 class="text-primary text-3xl font-bold tracking-tight">
        Progresso da Auditoria
      </h2>
    </div>
    <div class="mt-2 ml-1 flex flex-wrap items-center gap-2">
      <span class="ui-chip" title="Fechadura">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="13"
          height="13"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
        <span id="quality-progress-lock">—</span>
      </span>
      <span class="ui-chip ui-mono" title="ID da auditoria">
        <span id="quality-progress-id">—</span>
      </span>
    </div>
  </header>

  <section id="quality-steps-container" class="ui-panel">
    <div class="ui-panel-head">
      <div class="flex flex-wrap items-center gap-3">
        <h3 class="ui-panel-title">Status atual</h3>
        <span
          id="quality-test-status"
          class="ui-badge ui-badge-dot ui-tone-neutral"
          >Aguardando início</span
        >
      </div>
      <button
        id="btn-save-quality-report"
        type="button"
        class="ui-btn ui-btn-primary ui-btn-sm hidden"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
          />
          <polyline points="14 2 14 8 20 8" />
        </svg>
        Salvar relatório
      </button>
    </div>

    <div class="ui-section">
      <div class="mb-2 flex items-baseline justify-between gap-3">
        <p class="text-sm font-semibold">
          <span id="quality-progress-label">0 de 0 etapas</span>
        </p>
        <p id="quality-progress-pct" class="text-sm font-bold tabular-nums">
          0%
        </p>
      </div>
      <div
        id="quality-progress-track"
        class="ui-progress ui-tone-primary"
        style="height: 0.5rem"
      >
        <span id="quality-progress-bar" style="width: 0%"></span>
      </div>
      <div id="quality-progress-chips" class="mt-3 flex flex-wrap gap-2"></div>
    </div>

    <div class="ui-section">
      <h4 class="ui-section-title mb-4">Etapas do roteiro</h4>
      <ol id="quality-results-list" class="ui-timeline"></ol>
    </div>
  </section>
</div>
