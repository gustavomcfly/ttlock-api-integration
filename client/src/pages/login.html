<div
  id="login-screen"
  class="bg-background fixed inset-0 z-50 flex flex-col overflow-hidden md:flex-row"
>
  <div
    class="relative hidden w-full shrink-0 overflow-hidden bg-black md:flex md:w-1/2 lg:w-3/5"
  >
    <div class="pointer-events-none absolute inset-0 z-0 overflow-hidden">
      <div
        class="bg-primary absolute top-1/2 left-1/2 h-[60vw] w-[60vw] -translate-x-1/2 -translate-y-1/2 rounded-full opacity-15 blur-[160px]"
      ></div>
    </div>

    <img
      id="login-logo"
      alt="Pado"
      class="absolute top-8 left-8 z-20 h-30 w-auto"
    />

    <div
      class="relative z-10 flex h-full w-full flex-col items-center justify-center gap-8 p-12"
    >
      <div class="max-w-md text-center">
        <h1 class="text-3xl font-black tracking-tight text-white">
          Automatize testes em todas as
          <span class="text-primary">fechaduras Pado/TTlock.</span>
        </h1>
      </div>

      <div class="flex w-full max-w-sm flex-col items-center gap-4">
        <div
          id="login-carousel-viewport"
          class="relative h-20 w-full sm:h-100"
        ></div>
        <p
          id="login-carousel-caption"
          class="text-sm font-semibold tracking-wide text-white"
        ></p>
        <div
          id="login-carousel-dots"
          class="flex items-center justify-center gap-2"
        ></div>
      </div>
    </div>
  </div>

  <div
    class="border-border bg-background relative flex w-full flex-1 items-center justify-center border-l p-6 sm:p-10"
  >
    <div class="flex w-full max-w-sm flex-col gap-6">
      <img
        id="login-logo-mobile"
        alt="Pado"
        class="h-25 w-auto self-center md:hidden"
      />

      <div>
        <h2 class="text-foreground text-2xl font-bold tracking-tight">
          Entrar no TestLock
        </h2>
        <p class="text-muted-foreground mt-1 text-sm">
          Use sua conta Pado Digital Locking.
        </p>
      </div>

      <div class="flex flex-col gap-4">
        <div class="flex flex-col gap-1.5">
          <label
            class="text-muted-foreground text-xs font-semibold tracking-wide uppercase"
            >E-mail</label
          >
          <input
            type="text"
            id="username"
            placeholder="seu@email.com"
            class="border-border bg-background text-foreground focus:border-primary rounded-lg border px-3 py-2.5 text-sm transition-all focus:outline-none"
          />
        </div>

        <div class="flex flex-col gap-1.5">
          <label
            class="text-muted-foreground text-xs font-semibold tracking-wide uppercase"
            >Senha</label
          >
          <div class="relative w-full">
            <input
              type="password"
              id="password"
              placeholder="••••••••"
              class="border-border bg-background text-foreground focus:border-primary w-full rounded-lg border px-3 py-2.5 pr-11 text-sm transition-all focus:outline-none"
            />
            <button
              type="button"
              id="toggle-password"
              class="text-muted-foreground hover:text-foreground absolute top-1/2 right-3 -translate-y-1/2 cursor-pointer transition-colors focus:outline-none"
            >
              <svg
                id="eye-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <button
        id="btn-enter-app"
        class="bg-primary text-primary-foreground hover:bg-primary-hover flex w-full cursor-pointer items-center justify-center gap-2 rounded-xl px-4 py-3.5 text-base font-bold shadow-md transition-all disabled:cursor-not-allowed disabled:opacity-60"
      >
        Entrar no Sistema
      </button>

      <p class="text-muted-foreground text-center text-xs">
        Acesso restrito a testadores autorizados Pado.
      </p>
    </div>
  </div>
</div>
