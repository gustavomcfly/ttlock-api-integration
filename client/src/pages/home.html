<div id="view-home" class="block w-full transition-opacity duration-300">
  <header class="mb-8">
    <div class="mb-1 flex items-center gap-3">
      <div class="bg-primary/10 text-primary rounded-lg p-2">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 12 12 17 22 12"></polyline>
          <polyline points="2 17 12 22 22 17"></polyline>
        </svg>
      </div>
      <h2 class="text-primary text-3xl font-bold tracking-tight">
        Meus Dispositivos
      </h2>
    </div>
    <p class="text-muted-foreground mt-1 ml-1">
      Selecione uma fechadura para gerenciar.
    </p>
  </header>

  <section
    class="bg-card border-border overflow-hidden rounded-xl border shadow-sm"
  >
    <div
      class="border-border bg-muted/10 flex flex-col items-start justify-between gap-4 border-b p-4 sm:flex-row sm:items-center sm:p-6"
    >
      <h3 class="font-semibold">Lista de Fechaduras</h3>

      <div
        class="bg-muted/50 border-border/50 flex w-full items-center rounded-lg border p-1 sm:w-auto"
      >
        <button
          id="tab-online"
          class="active-tab bg-background text-foreground w-1/2 cursor-pointer rounded-md px-5 py-1.5 text-sm font-bold shadow-sm transition-all sm:w-auto"
        >
          Online
        </button>
        <button
          id="tab-offline"
          class="text-muted-foreground hover:text-foreground w-1/2 cursor-pointer rounded-md px-5 py-1.5 text-sm font-medium transition-all sm:w-auto"
        >
          Offline
        </button>
      </div>
    </div>

    <div class="w-full overflow-hidden md:overflow-x-auto">
      <table
        id="device-table"
        class="block hidden w-full border-collapse text-left md:table"
      >
        <thead class="hidden md:table-header-group">
          <tr
            class="bg-muted/30 text-muted-foreground border-border border-b text-xs tracking-wider uppercase"
          >
            <th class="px-6 py-4 text-center font-semibold">
              Nome da Fechadura
            </th>
            <th class="px-6 py-4 text-center font-semibold">ID da Fechadura</th>
            <th class="px-6 py-4 text-center font-semibold">Bateria</th>
            <th class="px-6 py-4 text-center font-semibold">Ação</th>
          </tr>
        </thead>
        <tbody
          id="device-list-body"
          class="divide-border block divide-y md:table-row-group"
        ></tbody>
      </table>
      <div
        id="no-devices"
        class="text-muted-foreground hidden p-10 text-center text-sm"
      >
        Nenhum dispositivo carregado.
      </div>
    </div>
  </section>
</div>
