<div id="view-home" class="block w-full transition-opacity duration-300">
  <header class="mb-6">
    <div class="mb-1 flex items-center gap-3">
      <div class="ui-icon-tile ui-icon-tile-lg">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 12 12 17 22 12"></polyline>
          <polyline points="2 17 12 22 22 17"></polyline>
        </svg>
      </div>
      <h2 class="text-primary text-3xl font-bold tracking-tight">
        Meus Dispositivos
      </h2>
    </div>
    <p class="text-muted-foreground mt-1 ml-1 max-w-3xl text-sm">
      Selecione uma fechadura para gerenciar.
    </p>
  </header>

  <section class="ui-panel">
    <div class="ui-panel-head">
      <div class="flex items-center gap-3">
        <span class="ui-icon-tile ui-icon-tile-sm"
          ><svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-list preview-icon"
          >
            <path d="M3 5h.01" />
            <path d="M3 12h.01" />
            <path d="M3 19h.01" />
            <path d="M8 5h13" />
            <path d="M8 12h13" />
            <path d="M8 19h13" /></svg
        ></span>
        <div>
          <h3 class="ui-panel-title">Lista de fechaduras</h3>
          <p class="ui-panel-subtitle">
            Selecione uma fechadura para abrir o painel de controle
          </p>
        </div>
      </div>

      <div
        class="bg-muted/50 border-border/50 flex w-full items-center rounded-lg border p-1 sm:w-auto"
      >
        <button
          id="tab-online"
          class="active-tab bg-background text-foreground w-1/2 cursor-pointer rounded-md px-5 py-1.5 text-sm font-bold shadow-sm transition-all sm:w-auto"
        >
          Online
        </button>
        <button
          id="tab-offline"
          class="text-muted-foreground hover:text-foreground w-1/2 cursor-pointer rounded-md px-5 py-1.5 text-sm font-medium transition-all sm:w-auto"
        >
          Offline
        </button>
      </div>
    </div>

    <div id="device-table" class="w-full p-5"></div>

    <!-- Fica FORA do #device-table: o render() limpa e esconde o container -->
    <div id="no-devices" class="hidden">
      <div class="ui-empty">
        <span class="ui-icon-tile ui-tone-neutral mb-2"
          ><svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg
        ></span>
        <p id="no-devices-title" class="text-sm font-semibold">
          Não há nenhuma fechadura online
        </p>
        <p
          id="no-devices-text"
          class="text-muted-foreground max-w-sm text-xs"
        ></p>
      </div>
    </div>
  </section>
</div>
