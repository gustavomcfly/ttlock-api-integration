<div
  id="view-cyclic-test-progress"
  class="hidden w-full transition-opacity duration-300"
>
  <button
    id="btn-back-cyclic-list"
    type="button"
    class="ui-btn ui-btn-ghost ui-btn-sm -ml-2 mb-4"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="m15 18-6-6 6-6" />
    </svg>
    Voltar para o Teste de Ciclagem
  </button>
  <header class="mb-6">
    <div class="mb-1 flex items-center gap-3">
      <div class="ui-icon-tile ui-icon-tile-lg">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
        </svg>
      </div>
      <h2 class="text-primary text-3xl font-bold tracking-tight">
        Progresso do Teste
      </h2>
    </div>
    <div class="mt-2 ml-1 flex flex-wrap items-center gap-2">
      <span class="ui-chip" title="Fechadura"
        ><svg
          xmlns="http://www.w3.org/2000/svg"
          width="13"
          height="13"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg
        ><span id="cyclic-progress-lock">—</span></span
      >
      <span class="ui-chip ui-mono" title="ID da fechadura"
        ><span id="cyclic-progress-id">—</span></span
      >
      <span
        id="cyclic-progress-user"
        class="ui-chip hidden"
        title="Iniciado por"
      ></span>
    </div>
  </header>
  <div id="cyclic-test-detail"></div>
</div>
